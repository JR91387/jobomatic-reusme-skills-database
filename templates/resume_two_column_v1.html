<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>$name - Resume</title>
<style>
@page { margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
p { margin: 0; }
ul { margin: 3px 0 0; padding-left: 16px; }
li { margin: 1.5px 0; }
.jh { display: flex; justify-content: space-between; gap: 12px; }
.jt { font-weight: 700; }
.jd { white-space: nowrap; }
.job, .rec, .edu { margin: 0 0 7px; break-inside: avoid; }
.contact span + span::before { content: " | "; }
a { color: inherit; text-decoration: none; }
section { break-inside: auto; }
h2 { break-after: avoid; }
body { font: 9.8pt/1.4 Carlito, Calibri, "Segoe UI", Arial, sans-serif; color: #1d2430; max-width: 8.5in; min-height: 100vh; margin: 0 auto; display: grid; grid-template-columns: 2.45in 1fr; grid-template-areas: "side main"; }
main { grid-area: main; padding: .5in .55in .45in .35in; }
aside { grid-area: side; background: #EEF2F7; padding: .5in .3in .45in .45in; border-right: 3px solid #1F3A5F; }
h1 { font-size: 22pt; margin: 0; color: #1F3A5F; line-height: 1.1; }
.headline { font-size: 10.5pt; color: #4a5568; margin: 4px 0 2px; }
h2 { color: #1F3A5F; font-size: 10.5pt; text-transform: uppercase; letter-spacing: .08em; margin: 12px 0 4px; border-bottom: 1px solid #b8c4d4; padding-bottom: 2px; }
aside h2 { margin-top: 14px; }
aside section:first-child h2 { margin-top: 0; }
aside .contact span { display: block; margin: 2px 0; overflow-wrap: anywhere; }
aside .contact span + span::before { content: none; }
aside .jh { display: block; }
aside .jd { display: block; font-size: 9pt; color: #4a5568; }
aside .sk p { margin: 3px 0; }
aside .sk b { display: block; color: #1F3A5F; }
.jt { color: #1F3A5F; }
.jo { color: #4a5568; }
@media print { body { max-width: none; } }
</style>
</head>
<body>
<main>
<header><h1>$name</h1><div class="headline">$headline</div></header>
$summary_section
$experience_section
$awards_section
$projects_section
</main>
<aside>
<section><h2>Contact</h2><div class="contact">$contact_html</div></section>
$skills_section
$education_section
$certifications_section
</aside>
</body>
</html>
